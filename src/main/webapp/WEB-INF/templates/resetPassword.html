<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"  xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/publicLayout}">
    <head>
    <title>Health-e-Link UT Reset Password</title>
    </head>
    <body>
        <div class="login-container" style="width:500px; margin-left: -250px;" layout:fragment="content">
            <div class="login clearfix">
                <header class="login-header" role="banner">
                    <div class="login-header-content">
                        <p style="color:white; font-family: sans-serif; font-size: 25px">Health-e-Link Universal Translator</p>
                    </div>
                </header>
                <form id="resetPassword" method="post" role="form" th:action="@{'resetPassword'}">
                     <input type="hidden" name="resetCode" th:value="${resetCode}" id="resetCode" required class="form-control" />
                    <div class="form-container">
                        <div id="newPasswordDiv" class="form-group" th:classappend="${error} ? 'has-error' : ''">
                            <label class="control-label" for="identifier">New Password</label>
                            <input id="newPassword" name="newPassword" required class="form-control" type="password" maxLength="15" />
                            <span id="newPasswordMsg" class="control-label"></span>
                        </div>
                        <div id="confirmPasswordDiv" class="form-group" th:classappend="${error} ? 'has-error' : ''">
                            <label class="control-label" for="identifier">Confirm Password</label>
                            <input id="confirmPassword" name="confirmPassword" required class="form-control" type="password" maxLength="15" />
                            <span id="confirmPasswordMsg" class="control-label"></span>
                        </div>    
                        <div class="form-group">
                            <input type="button" id="submitButton" class="btn btn-primary pull-right" value="Reset Password"/>
                        </div>
                    </div>
                </form>
            </div>
             <p class="login-note"><a href="/" title="Return to the Login Page">Return to the Login Page</a></p>
        </div>
        <th:block layout:fragment="script">
        <script th:src="@{/dspResources/js/admin/resetPassword.js}"></script>
    </th:block>
  </body>
</html>
