<div class="modal-header">
    <div class="col-md-12">
        <div class="col-md-6" style="padding-left:0px;">
            <h3 class="panel-title" style="margin-top:15px;margin-bottom:10px">Status Details</h3>
        </div>
        <div class="col-md-6" style="padding-right:0px;">
            <button class="btn btn-success btn-sm pull-right" data-bs-dismiss="modal" title="Close Window" style="margin-top:10px;margin-bottom:10px">Close Window</button>
        </div>
    </div>
</div>
<div class="modal-body">
    <div class="form-container">
        <div class="form-group">
            <label class="control-label" >Status Code / End User Status Code</label>
            <br />
            <span th:text="${statusDetails.displayCode + ' / ' + statusDetails.endUserDisplayCode}"></span>
        </div>

        <div class="form-group">
            <label class="control-label" >Status Text</label>
            <br />
            <span th:text="${statusDetails.displayText}"></span>
        </div> 
        <div class="form-group">
            <label class="control-label" >End User Status Text</label>
            <br />
            <span th:text="${statusDetails.endUserDisplayText}"></span>
        </div>               
        <c:if test="${not empty statusDetails.description}">
            <div class="form-group">
                <label class="control-label" >Description</label>
                <br />
                <span th:text="${statusDetails.description}"></span>
            </div>
        </c:if>
    </div>
</div>
