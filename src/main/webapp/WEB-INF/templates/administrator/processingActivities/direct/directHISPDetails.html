<div class="modal-header">
    <div class="col-md-12">
        <div class="col-md-6" style="padding-left:0px;">
            <h3 class="panel-title" style="margin-top:15px;margin-bottom:10px">Direct HISP Message Details</h3>
        </div>
        <div class="col-md-6" style="padding-right:0px;">
            <button class="btn btn-success btn-sm pull-right" data-bs-dismiss="modal" title="Close Window" style="margin-top:10px;margin-bottom:10px">Close Window</button>
        </div>
    </div>
</div>
<div class="modal-body">
    <div class="form-container">
        <div class="form-group">
            <label class="control-label" >From Direct Address</label>
            <br />
            <span th:text="${directMessageDetails.fromDirectAddress}"></span>
        </div>
        <div class="form-group">
            <label class="control-label" >To Direct Address</label>
            <br />
            <span th:text="${directMessageDetails.toDirectAddress}"></span>
        </div>
        <div class="form-group">
            <label class="control-label" >Received File Name from HISP (Archived)</label>
            <br />
            <span th:text="${directMessageDetails.archiveFileName}"></span>
        </div> 
        <div class="form-group">
            <label class="control-label" >Received Direct Message (JSON) File</label>
            <br />
            <a th:href="'/FileDownload/downloadFile.do?filename='+${directMessageDetails.originalDirectMessage}+'&foldername=medAlliesArchives&fromPage=directmessages'" title="View File"><span th:text="${directMessageDetails.originalDirectMessage}"></span></a>
        </div> 
        <th:block th:if="${directMessageDetails.sendingResponse != ''}">
            <div class="form-group">
                <label class="control-label" >UT Sent Response</label>
                <br />
                <span th:text="${directMessageDetails.sendingResponse}"></span>
            </div>
        </th:block>
    </div>
</div>
