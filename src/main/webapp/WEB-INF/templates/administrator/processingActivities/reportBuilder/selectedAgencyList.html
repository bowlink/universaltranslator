<div class="modal-header">
    <div class="col-md-12">
        <div class="col-md-6" style="padding-left:0px;">
            <h3 class="panel-title" style="margin-top:15px;margin-bottom:10px">Selected Agencies</h3>
        </div>
        <div class="col-md-6" style="padding-right:0px;">
            <button class="btn btn-success btn-sm pull-right" data-bs-dismiss="modal" title="Close Window" style="margin-top:10px;margin-bottom:10px">Close Window</button>
        </div>
    </div>
</div>
<div class="modal-body">
    <div th:if="${not #lists.isEmpty(agencies)}">
        <table class="table table-bordered table-striped table-hover table-default">
            <thead>
                <tr>
                    <th style="width:90%">Agency</th>
                </tr>
            </thead>
            <tbody>
                <th:block th:each="agency : ${agencies}">
                    <tr>
                        <td th:text="${agency.orgName}"></td>
                    </tr>
                </th:block>
            </tbody>
        </table>
    </div>
    <div th:unless="${not #lists.isEmpty(agencies)}">
        <p>No agencies were found based on the selected activity report.</p>
    </div>
</div>
