<table class="table table-striped table-hover table-default">
    <thead>
	<tr>
	    <th scope="col" class="center-text">Field No</th>
	    <th scope="col">Field Name</th>
	    <th scope="col" class="center-text">Use Field</th>
	    <th scope="col" class="center-text">Required</th> 
	    <th scope="col" class="center-text">Matching Source Field</th>
	    <th th:if="${showErrorField}" scope="col" class="center-text">Error Field <span class="badge badge-help" id="toolTipBTN" data-bs-toggle="tooltip" data-bs-placement="top" title="Select the column that holds the data from the source file to show on the audit report.">?</span></th>
	</tr>
    </thead>
    <tbody>
        <th:block th:each="fields, field : ${targetConfigurationDataElements}">
	    <tr class="uFieldRow" th:rel="${fields.fieldNo}" th:rel2="${field.index}">
                <td scope="row" class="center-text" th:text="${fields.fieldNo}"></td>
		<td th:text="${fields.fieldDesc}"></td>
		<td class="center-text">
                    <input type="hidden" th:name="${'targetConfigurationDataElements['+field.index+'].useField'}" th:value="${fields.useField}" />
                    <input type="checkbox" disabled="true" class="useField" th:id="${'useField'+fields.fieldNo}" th:name="${'targetConfigurationDataElements['+field.index+'].useField'}" th:checked="${fields.useField == true ? true : false}" />
		</td>
                <td class="center-text">
                    <span th:if="${fields.required == true}">Required</span>
                     <span th:unless="${fields.required == true}">Not Required</span>
		</td>
		<td class="center-text">
		    <div th:id="matchField+${fields.fieldNo}" class="form-group">
			<select th:fieldNo="${fields.fieldNo}" th:fieldDesc="${fields.fieldDesc}" th:copyErrorField="${showErrorField ? 'yes' : 'no'}" class="form-control matchField">
                            <option value="0">- Blank Value -</option>
                            <option th:if="${fields.defaultValue != ''}" th:value="${'0~'+fields.defaultValue}" selected="selected" th:text="${'- Default Value ('+fields.defaultValue+') -'}"></option>
                            <th:block th:each="sourceFields : ${sourceconfigurationDataElements}">
                                <option th:if="${sourceFields.useField == true}" th:value="${sourceFields.fieldNo}" th:selected="*{sourceFields.fieldNo == fields.mappedToField ? 'true' : 'false'}" th:text="${sourceFields.fieldDesc + ' - ' + sourceFields.fieldNo}"></option>
                            </th:block>
			</select>
		    </div>
		</td>
		<c:if test="${showErrorField}">
		    <td class="center-text">
			<div th:id="errorField+${fields.fieldNo}" class="form-group">
			    <select th:fieldNo="${fields.fieldNo}" th:id="${'errorFieldSel'+fields.fieldNo}" class="form-control errorField">
				<option value="0">- Outbound Value -</option>
                                <th:block th:each="sourceFields : ${sourceconfigurationDataElements}">
                                    <option th:if="${sourceFields.useField == true}" th:value="${sourceFields.fieldNo}" th:selected="*{sourceFields.fieldNo == fields.mappedErrorField ? 'true' : 'false'}" th:text="${sourceFields.fieldDesc + ' - ' + sourceFields.fieldNo}"></option>
                                </th:block>
			    </select>
			</div>
		    </td>
		</c:if>
	    </tr>
	</th:block>
    </tbody>
</table>
