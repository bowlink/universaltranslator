<div class="modal-header">
    <div class="col-md-12">
        <div class="col-md-6" style="padding-left:0px;">
            <h3 class="panel-title" style="margin-top:15px;margin-bottom:10px">System Administrator Logins</h3>
        </div>
        <div class="col-md-6" style="padding-right:0px;">
            <button class="btn btn-success btn-sm pull-right" data-bs-dismiss="modal" title="Close Window" style="margin-top:10px;margin-bottom:10px">Close Window</button>
        </div>
    </div>
</div>
<div class="modal-body">
    <div class="form-container">
        <table class="table table-striped table-hover table-default" th:id="${not #lists.isEmpty(systemAdminLogins) ? 'loginDataTable' : ''}">
            <thead>
                <tr>
                    <th scope="col" class="center-text">Log In Date</th>
                    <th scope="col" class="center-text">Session Length</th>
                </tr>
            </thead>
            <tbody>
                <div th:if="${not #lists.isEmpty(systemAdmins)}">
                    <tr style="cursor: pointer" th:each="systemAdminLogin : ${systemAdminLogins}">
                        <td class="center-text" th:text="${#dates.format(systemAdminLogin.dateCreated, 'M/dd/yy h:mm a')}"></td>
                        <td class="center-text">
                            <span th:if="${systemAdminLogin.totalTimeLoggedIn > 0}">${systemAdminLogin.totalTimeLoggedIn} min</span>
                            <span th:unless="${systemAdminLogin.totalTimeLoggedIn > 0}">N/A</span>
                        </td>
                    </tr>
                </div>
                <div th:unless="${not #lists.isEmpty(systemAdmins)}">
                    <tr><td colspan="2" class="center-text">There are currently no logins for this system administrator.</td></tr>
               </div>
            </tbody>
        </table>
    </div>
</div>
