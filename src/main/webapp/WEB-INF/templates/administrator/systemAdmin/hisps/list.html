<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"  xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/loggedInLayout}">
    <head>
        <title>Health-e-Link UT HISPS</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div th:insert="~{administrator/systemAdmin/actionBar :: actionBar}"></div>
            <div th:insert="~{administrator/systemAdmin/menuBar :: menuBar}"></div>
            <div class="main clearfix" role="main">
                <div class="col-md-12">
                    <div class="alert alert-success" role="alert" th:if="${param.msg != null}">
                        <strong>Success!</strong> 
                        <p th:if="${param.msg[0] == 'updated'}">The hisp has been successfully updated!</p>
                        <p th:if="${param.msg[0] == 'created'}">The hisp has been successfully added!</p>
                        <p th:if="${param.msg[0] == 'deleted'}">The hisp has been successfully deleted!</p>
                    </div>
                    <section class="panel panel-info">
                        <div class="panel-heading">
                            <h3 class="panel-title">HISPS</h3>
                        </div>
                        <div class="panel-body">
                            <div class="scrollable">
                                <div class="col-md-12">
                                    <table class="table table-striped table-hover table-default" th:id="${not #lists.isEmpty(hisps) ? 'hispsListtable' : ''}">
                                        <thead>
                                            <tr>
                                                <th scope="col">Name</th>
                                                <th scope="col">Primary Contact</th>
                                                <th scope="col">Date Created</th>
                                                <th scope="col"></th>
                                            </tr>
                                        </thead>
                                        <div th:if="${not #lists.isEmpty(hisps)}">
                                            <tr style="cursor: pointer" th:each="hisp : ${hisps}">
                                                <td scope="row">
                                                    <a href="#hispModal" data-bs-toggle="modal" th:rel="${hisp.id}" class="hispEdit" title="Edit this HISP">
                                                        <span th:text="${hisp.hispName}"></span>
                                                    </a>
                                                </td>
                                                <td>
                                                    <p th:text="${hisp.primaryContact}"></p>
                                                    <p th:text="${hisp.primaryContactEmail}"></p>
                                                    <p th:text="${hisp.primaryContactPhone}"></p>
                                                </td>
                                                <td th:text="${#dates.format(hisp.dateCreated, 'M/dd/yy h:mm a')}"></td>
                                                <td class="center-text">
                                                    <div class="dropdown pull-left">
                                                        <button class="btn btn-sm btn-default dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                                            <i class="fa fa-cog"></i>
                                                        </button>
                                                        <ul class="dropdown-menu pull-right">
                                                            <li>
                                                                 <a href="#hispModal" data-bs-toggle="modal" th:rel="${hisp.id}" class="hispEdit" title="Edit this HISP">
                                                                    <span class="glyphicon glyphicon-edit"></span>
                                                                    Edit HISP
                                                                </a>
                                                            </li>
                                                        </ul>
                                                    </div>
                                                </td>
                                            </tr>
                                        </div>
                                        <div th:unless="${not #lists.isEmpty(hisps)}">
                                             <tr><td colspan="4" class="center-text">There are currently no HISPS set up.</td></tr>
                                        </div>
                                    </table>
                                </div>    
                            </div>
                        </div>
                    </section>
                </div>
            </div>		
        </div>
        <th:block layout:fragment="script">
            <script th:src="@{/dspResources/js/vendor/sprintf.js}"></script>    
            <script th:src="@{/dspResources/js/overlay.js}"></script>    
            <script th:src="@{/dspResources/js/vendor/dataTables/jquery.dataTables.min.js}"></script>
            <script th:src="@{/dspResources/js/vendor/dataTables/jquery.dataTables.bootstrap.min.js}"></script>
            <script th:src="@{/dspResources/js/admin/sysadmin/hisps/list.js}"></script>
            <script th:src="@{/dspResources/js/admin/sysadmin/mainAdminFunctions.js}"></script>
        </th:block>
    </body>
</html>
<div class="modal fade" id="hispModal" role="dialog" tabindex="-1" aria-labeledby="Configuration File Upload" aria-hidden="true" aria-describedby="Configuration File Upload">
    <div class="modal-dialog modal-lg"><div class="modal-content" id="hispModalContent"></div></div>
</div>
