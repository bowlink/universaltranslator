<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"  xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/loggedInLayout}">
     <head>
        <title>Health-e-Link UT Configuration Audit Logs</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div th:insert="~{administrator/configurations/actionBar :: actionBar}"></div>
            <div th:insert="~{administrator/configurations/menuBar :: menuBar}"></div>
            <div class="main clearfix" role="main">
                <div class="row-fluid">
                    <div class="col-md-12">
                        <section class="panel panel-info">
                            <div class="panel-heading">
                                <h3 class="panel-title">Configuration Audit Logs</h3>
                            </div>
                            <div class="panel-body">
                                <div class="form-container scrollable">
                                    <table class="table table-striped table-hover table-default" th:id="${not #lists.isEmpty(auditLogs) ? 'auditLogs' : ''}">
                                        <thead>
                                            <tr>
                                                <th scope="col" style="width:30%">Updated Module</th>
                                                <th scope="col" style="width:30%">Snapshot</th>
                                                <th scope="col" style="width:20%">Updated By</th>
                                                <th scope="col" class="center-text" style="width:15%">Date Updated</th>
                                                <th scope="col" style="width:5%"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <div th:if="${not #lists.isEmpty(auditLogs)}">
                                                <th:block th:each="auditLog : ${auditLogs}">
                                                    <tr>
                                                        <td th:text="${auditLog.moduleName == 'Schedule' ? 'Processing Schedule' : auditLog.moduleName == 'Crosswalk' ? 'Data Translation - Crosswalks' : auditLog.moduleName}"></td>
                                                        <td th:text="${auditLog.snapShotType}"></td>
                                                        <td th:text="${auditLog.updatedBy}"></td>
                                                        <td class="center-text" th:text="${#dates.format(auditLog.dateUpdated, 'M/dd/yy h:mm a')}"></td>
                                                        <td>
                                                            <div class="dropdown pull-left">
                                                                <button class="btn btn-sm btn-default dropdown-toggle" type="button" data-bs-toggle="dropdown">
                                                                    <i class="fa fa-cog"></i>
                                                                </button>
                                                                <ul class="dropdown-menu pull-right">
                                                                    <li>
                                                                         <a th:href="${'/FileDownload/downloadFile.do?fromPage=configurationAuditLog&utBatchId='+id+'&orgId='+orgDetails.Id+'&foldername=configurationAuditLog&filename='+auditLog.fileName}" title="Download this log">
                                                                            <span class="glyphicon glyphicon-edit"></span>
                                                                            Download Log
                                                                        </a>
                                                                    </li>
                                                                </ul>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                </th:block>
                                            </div>
                                            <div th:if="${#lists.isEmpty(auditLogs)}">
                                                <tr><td colspan="5" class="center-text">There are currently no audit logs for this configuration .</td></tr>
                                            </div>
                                        </tbody>
                                    </table>
                               </div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </div>
        <th:block layout:fragment="script">
            <script th:src="@{/dspResources/js/vendor/dataTables/jquery.dataTables.min.js}"></script>
            <script th:src="@{/dspResources/js/vendor/dataTables/jquery.dataTables.bootstrap.min.js}"></script>
            <script th:src="@{/dspResources/js/vendor/sprintf.js}"></script>    
            <script th:src="@{/dspResources/js/overlay.js}"></script>    
            <script th:src="@{/dspResources/js/admin/configuration/mainConfigFunctions.js}"></script>
            <script th:src="@{/dspResources/js/admin/configuration/auditLogs/list.js}"></script>
        </th:block>
    </body>
</html>
