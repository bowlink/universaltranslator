<div class="modal-header">
    <div class="col-md-12">
        <div class="col-md-6" style="padding-left:0px;">
            <h3 class="panel-title" style="margin-top:15px;margin-bottom:10px">Configuration Note Details</h3>
        </div>
        <div class="col-md-6" style="padding-right:0px;">
            <button class="btn btn-success btn-sm pull-right" data-bs-dismiss="modal" title="Close Window" style="margin-top:10px;margin-bottom:10px">Close Window</button>
        </div>
    </div>
</div>
<div class="modal-body" style="max-height:800px; overflow: auto">
    <form id="configurationNoteForm" th:action="${configurationNote.id > 0 ? '/administrator/configurations/editConfigurationNote' : '/administrator/configurations/newConfigurationNote'}" th:object="${configurationNote}" method="post" role="form">
        <input type="hidden" id="id" th:field="*{id}"/>
        <input type="hidden" th:field="*{configId}"/>
        <input type="hidden" th:field="*{dateCreated}"/>
        <input type="hidden" th:field="*{userId}"/>
        
        <div class="form-container">
            <div id="updateMadeDiv" class="form-group">
                <label class="control-label" for="updateMade">Note *</label>
                <textarea  th:field="*{updateMade}" id="updateMade" class="form-control" rows="10" cols="10" />
                <span id="updateMadeMsg" class="control-label"></span>
            </div>
            <div class="form-group">
                <input type="button" id="submitConfigurationNote" class="btn btn-primary" value="Save Note"/>
            </div>
        </div>
    </form>
</div>
