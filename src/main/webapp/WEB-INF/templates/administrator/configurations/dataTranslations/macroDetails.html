<div class="modal-header">
    <div class="col-md-12">
        <div class="col-md-6" style="padding-left:0px;">
            <h3 class="panel-title" style="margin-top:15px;margin-bottom:10px">Macro Details</h3>
        </div>
        <div class="col-md-6" style="padding-right:0px;">
            <button class="btn btn-success btn-sm pull-right" data-bs-dismiss="modal" title="Close Window" style="margin-top:10px;margin-bottom:10px">Close Window</button>
        </div>
    </div>
</div>
<div class="modal-body" style="max-height:800px; overflow: auto">
    <th:block th:if="${fieldA_Question != ''}">
        <div id="fieldADiv" class="form-group">
            <label class="control-label" for="fieldAQuestion" th:text="${fieldA_Question}"></label>
            <th:block th:if="${fieldAContainsCW == true and not #lists.isEmpty(crosswalks)}">
                <input type="hidden" id="fieldAQuestionSelect" value="" />
                <select class="form-control" id="fieldAQuestion">
                    <option value="">-Select Crosswalk -</option>
                    <option th:each="cw : ${crosswalks}" th:value="${cw.id}" th:text="${cw.name}"></option>
                </select>
            </th:block>
            <th:block th:unless="${fieldAContainsCW == true and not #lists.isEmpty(crosswalks)}">
                <input type="text" id="fieldAQuestion" class="form-control" maxLength="255" />
            </th:block>
            <span id="fieldAMsg" class="control-label"></span>
        </div>
    </th:block>
    <th:block th:if="${fieldA_Question != ''}">
         <script>
            populateFieldA();
        </script>
    </th:block>
    <th:block th:if="${fieldB_Question != ''}">
        <div id="fieldBDiv" class="form-group">
            <label class="control-label" for="fieldBQuestion" th:text="${fieldB_Question}"></label>
            <th:block th:if="${fieldBContainsCW == true and not #lists.isEmpty(crosswalks)}">
                <input type="hidden" id="fieldBQuestionSelect" value="" />
                <select class="form-control" id="fieldBQuestion">
                    <option value="">-Select Crosswalk -</option>
                    <option th:each="cw : ${crosswalks}" th:value="${cw.id}" th:text="${cw.name}"></option>
                </select>
            </th:block>
            <th:block th:unless="${fieldBQuestion == true and not #lists.isEmpty(crosswalks)}">
                <input type="text" id="fieldBQuestion" class="form-control" maxLength="255" />
            </th:block>
            <span id="fieldBMsg" class="control-label"></span>
        </div>
    </th:block>
    <th:block th:if="${Con1_Question != ''}">
        <div id="Con1Div" class="form-group">
            <label class="control-label" for="Con1Question" th:text="${Con1_Question}"></label>
            <th:block th:if="${con1ContainsCW == true and not #lists.isEmpty(crosswalks)}">
                <input type="hidden" id="Con1QuestionSelect" value="" />
                <select class="form-control" id="Con1Question">
                    <option value="">-Select Crosswalk -</option>
                    <option th:each="cw : ${crosswalks}" th:value="${cw.id}" th:text="${cw.name}"></option>
                </select>
            </th:block>
            <th:block th:unless="${con1ContainsCW == true and not #lists.isEmpty(crosswalks)}">
                <input type="text" id="Con1Question" class="form-control" maxLength="255" />
            </th:block>
            <span id="Con1Msg" class="control-label"></span>
        </div>
    </th:block>
    <th:block th:if="${Con2_Question != ''}">
        <div id="Con2Div" class="form-group">
            <label class="control-label" for="Con2Question" th:text="${Con2_Question}"></label>
            <th:block th:if="${con2ContainsCW == true and not #lists.isEmpty(crosswalks)}">
                <input type="hidden" id="Con2QuestionSelect" value="" />
                <select class="form-control" id="Con2Question">
                    <option value="">-Select Crosswalk -</option>
                    <option th:each="cw : ${crosswalks}" th:value="${cw.id}" th:text="${cw.name}"></option>
                </select>
            </th:block>
            <th:block th:unless="${con2ContainsCW == true and not #lists.isEmpty(crosswalks)}">
                <input type="text" id="Con2Question" class="form-control" maxLength="255" />
            </th:block>
            <span id="Con2Msg" class="control-label"></span>
        </div>
    </th:block>
    <div class="form-group">
        <input type="button" class="btn btn-primary submitMacroDetailsButton" value="Save"/>
    </div>
</div>
