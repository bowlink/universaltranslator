
<html>
    <body>
        <table class="table responsive table-bordered table-hover">
            <thead>
                <tr style="background-color:#f5f5f5">
                    <th scope="col">Field</th>
                    <th scope="col">Macro Name</th>
                    <th scope="col">Crosswalk Name</th>
                    <th scope="col" class="center-text">Pass/Clear</th>
                    <th scope="col" class="center-text">Field A</th>
                    <th scope="col" class="center-text">Field B</th>
                    <th scope="col" class="center-text">Constant 1</th>
                    <th scope="col" class="center-text">Constant 2</th>
                    <th scope="col" class="center-text">Process Order</th>
                    <th scope="col" class="center-text"></th>
                </tr>
            </thead>
            <tbody>
                <div th:if="${not #lists.isEmpty(dataTranslations)}">
                    <th:block th:each="translation, tStatus : ${dataTranslations}">
                        <tr>
                            <td scope="row" th:text="${'F'+translation.FieldNo + ' - ' + translation.fieldName}">
                            </td>
                            <td th:text="${translation.macroName}"></td>
                            <td th:text="${translation.crosswalkName}"></td>
                            <td class="center-text">
                                <span th:if="${translation.passClear == 1}" th:text="Pass"></span>
                                <span th:unless="${translation.passClear == 1}" th:text="Clear"></span>
                            </td>
                            <td class="center-text" th:text="${translation.fieldA}"></td>
                            <td class="center-text" th:text="${translation.fieldB}"></td>
                            <td class="center-text" th:text="${translation.constant1}"></td>
                            <td class="center-text" th:text="${translation.constant2}"></td>
                            <td class="center-text">
                                <select th:data-id="${translation.id}" name="processOrder" class="processOrder">
                                    <option value="">- Select -</option>
                                    <option th:each="i : ${#numbers.sequence(1, dataTranslations.size())}" th:selected="${translation.processOrder == i ? 'true' : 'false'}" th:value="${i}" th:text="${i}"></option>
                                </select>   
                            </td>
                            <td class="center-text">
                                <a href="javascript:void(0);" class="btn btn-link removeTranslation" th:data-id="${translation.id}" title="Remove this field translation.">
                                    <span class="glyphicon glyphicon-edit"></span>
                                    Remove
                                </a>
                            </td>
                        </tr>
                    </th:block>
                </div>
                <div th:if="${#lists.isEmpty(dataTranslations)}">
                    <tr><td colspan="10" class="center-text">No Existing Translations Found</td></tr>
                </div>
            </tbody>
        </table>
    </body>
</html>
