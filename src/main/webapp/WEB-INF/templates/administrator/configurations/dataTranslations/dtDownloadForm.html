<div class="modal-header">
    <div class="col-md-12">
        <div class="col-md-6" style="padding-left:0px;">
            <h3 class="panel-title" style="margin-top:15px;margin-bottom:10px">Generate Data Translations CSV File</h3>
        </div>
        <div class="col-md-6" style="padding-right:0px;">
            <button class="btn btn-success btn-sm pull-right btnCloseCW" data-bs-dismiss="modal" title="Close Window" style="margin-top:10px;margin-bottom:10px">Close Window</button>
        </div>
    </div>
</div>
<div class="modal-body">
    <div id="successMsg" style="display:none;"><p class="text-success">The Data Translation CSV file has successfully downloaded (Check your downloads folder)</p></div>
    <div id="errorMsg" style="display:none;"><p class="text-danger">No data translations were found.</p></div>
    <div class="form-container">
        <div class="form-group" id="dtnameDiv">
            <label class="control-label" for="name">Data Translations File Name *</label>
            <input type="text" id="fileName" class="form-control" th:value="${fileName}" readonly="" maxLength="55" />
            <div class="control-label has-error" id="nameLabelDiv"></div>
        </div>
        <div class="form-group">
            <input type="button" id="generateDTButton" th:rel="${configId}" role="button" class="btn btn-primary" value="Generate Data Translations CSV File"/>
        </div>
    </div>
</div>
