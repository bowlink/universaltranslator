<div class="modal-header">
    <div class="col-md-12">
        <div class="col-md-6" style="padding-left:0px;">
            <h3 class="panel-title" style="margin-top:15px;margin-bottom:10px">Dashboard Watch List Entry Details</h3>
        </div>
        <div class="col-md-6" style="padding-right:0px;">
            <button class="btn btn-success btn-sm pull-right btnCloseCW" data-bs-dismiss="modal" title="Close Window" style="margin-top:10px;margin-bottom:10px">Close Window</button>
        </div>
    </div>
</div>
<div class="modal-body">
    <ul class="nav nav-pills" id="pills-tab" role="tablist" aria-orientation="hotizontal">
        <li class="nav-item" th:classappend="${watchlistEntry.id == 0 or (watchlistEntry.id > 0 and watchlistEntry.orgId == 0) ? 'active' : '' }">
            <button class="nav-link" th:classappend="${watchlistEntry.id == 0 or (watchlistEntry.id > 0 and watchlistEntry.orgId == 0) ? 'active' : '' }" id="generic-entry-tab" data-bs-toggle="tab" data-bs-target="#generic" type="button" role="tab" aria-controls="generic" aria-selected="true">Generic Entry</button>
        </li>
        <li class="nav-item" th:classappend="${(watchlistEntry.id > 0 and watchlistEntry.orgId > 0) ? 'active' : '' }">
            <button class="nav-link" th:classappend="${(watchlistEntry.id > 0 and watchlistEntry.orgId > 0) ? 'active' : '' }" id="messageType-entry-tab" data-bs-toggle="tab" data-bs-target="#messageType" type="button" role="tab" aria-controls="messageType" aria-selected="true">Message Type Entry</button>
        </li>
    </ul>
    <div class="tab-content">
        <div class="tab-pane" th:classappend="${watchlistEntry.id == 0 || (watchlistEntry.id > 0 && watchlistEntry.orgId == 0) ? 'active' : '' }" id="generic">
            <div class="form-container scrollable"  style="padding-top:20px;">
                <form id="watchListGenericEntryForm" th:object="${watchlistEntry}" th:action="${'/watchlist/addDashboardWatchList.do'}" method="post" role="form">
                    <input type="hidden" id="id" th:field="*{id}"/>
                    <input type="hidden" th:field="*{orgId}"/>
                    <input type="hidden" th:field="*{configId}" />
                    <input type="hidden" id="expectFirstFileTime" th:field="*{expectFirstFileTime}"/>
                    
                    <div id="entryMessageDiv" class="form-group" th:classappend="${#fields.hasErrors('entryMessage') ? 'has-error' : ''}">
                        <label class="control-label" for="entryMessage">Message *</label>
                        <input th:field="*{entryMessage}" id="entryMessage" class="form-control" type="text" maxLength="55" />
                        <span class="control-label" th:if="${#fields.hasErrors('entryMessage')}" th:errors="*{entryMessage}"></span>
                        <span id="entryMessageMsg" class="control-label"></span>
                    </div>
                    <div id="expectedDiv" class="form-group"  th:classappend="${#fields.hasErrors('expected') ? 'has-error' : ''}">
                        <label class="control-label" for="expected">Alert Repeated *</label>
                        <select id="expected" th:field="*{expected}" class="form-control half">
                            <option value="Daily">Daily</option>
                            <option value="Weekly">Weekly</option>
                            <option value="Monthly">Monthly</option>
                        </select>
                        <errors path="expectedMsg" cssClass="control-label" element="label" />
                    </div> 
                    <div id="expectFirstFileDiv" class="form-group" th:classappend="${#fields.hasErrors('expectFirstFile') ? 'has-error' : ''}">
                        <label class="control-label" for="expectFirstFile">Date to start the alert *</label>
                        <input th:field="*{expectFirstFile}" id="expectFirstFile" class="form-control expectFirstFile" type="text" maxLength="10" />
                        <span class="control-label" th:if="${#fields.hasErrors('entryMessage')}" th:errors="*{entryMessage}"></span>
                        <span id="expectFirstFileMsg" class="control-label"></span>
                    </div>
                    <div id="expectFirstFileTimeDiv">
                        <label class="control-label" for="expectedTimeHour">Time to start the alert</label>
                        <div class="row">
                            <div class="col-md-4">
                                <select id="expectedTimeHour" class="form-control">
                                    <option th:each="hour : ${#numbers.sequence(1, 12, 1)}" th:selected="${watchlistEntry.expectedTimeHour == hour ? 'true' : 'false'}" th:value="${hour}" th:text="${hour}"></option>
                                </select> 
                            </div>
                            <div class="col-md-4">
                                <select id="expectedTimeMinute" class="form-control">
                                     <option th:each="minute : ${#numbers.sequence(0, 55, 5)}" th:selected="${watchlistEntry.expectedTimeMinute == minute ? 'true' : 'false'}" th:value="${minute}" th:text="${minute < 10 ? '0'+minute : minute}"></option>
                                </select> 
                            </div>
                            <div class="col-md-4">
                                <select id="expectedTimeAMPM" class="form-control">
                                    <option value="AM" th:selected="${watchlistEntry.expectedTimeAMPM == 'AM' ? 'true' : 'false'}">AM</option>
                                    <option value="PM" th:selected="${watchlistEntry.expectedTimeAMPM == 'PM' ? 'true' : 'false'}">PM</option>
                                </select>
                            </div>
                        </div>
                    </div> 
                </form>
            </div>
        </div>
        <div class="tab-pane" th:classappend="${(watchlistEntry.id > 0 && watchlistEntry.orgId > 0) ? 'active' : '' }" id="messageType">
            <div class="form-container scrollable" style="padding-top:20px;">
                <form id="watchListEntryForm" th:object="${watchlistEntry}" th:action="${'/watchlist/addDashboardWatchList.do'}" method="post" role="form">
                    <input type="hidden" id="id" th:field="*{id}"/>
                    <input type="hidden" id="expectFirstFileTimeMT" th:field="*{expectFirstFileTime}"/>
                    
                    <div id="orgDiv" class="form-group" th:classappend="${#fields.hasErrors('orgId') ? 'has-error' : ''}">
                        <label class="control-label" for="organization">Organization *</label>
                         <select th:field="*{orgId}" id="organization" class="form-control selOrganization" th:disabled="${watchlistEntry.id > 0 ? 'true':'false'}">
                            <option value="">- Select -</option>
                            <option th:each="org, oStatus : ${organizations}" th:value="${organizations[oStatus.index].id}" th:text="${organizations[oStatus.index].orgName}"></option>
                        </select>
                        <th:block th:if="${watchlistEntry.id > 0}">
                            <input type="hidden" th:field="*{orgId}" />
                        </th:block>  	
                        <span id="orgMsg" class="control-label"></span>
                    </div>
                    <div id="orgDiv" class="form-group" th:classappend="${#fields.hasErrors('configId') ? 'has-error' : ''}">
                        <label class="control-label" for="config">Configuration *</label>
                         <select th:field="*{configId}" id="config" class="form-control" th:rel="${watchlistEntry.configId}" th:disabled="${watchlistEntry.id > 0 ? 'true':'false'}">
                            <option value="">- Select -</option>
                         </select>
                        <th:block th:if="${watchlistEntry.id > 0}">
                            <input type="hidden" id="configId" th:field="*{configId}" />
                        </th:block>  	
                        <span id="configMsg" class="control-label"></span>
                    </div>
                    <div id="expectedDiv" class="form-group ${status.error ? 'has-error' : '' }">
                        <label class="control-label" for="expected">Alert Repeated *</label>
                        <select path="expected" id="expected" class="form-control">
                            <option value="Daily" th:selected="${watchlistEntry.expected == 'Daily' ? 'true' : 'false'}">Daily</option>
                            <option value="Weekly" th:selected="${watchlistEntry.expected == 'Weekly' ? 'true' : 'false'}">Weekly</option>
                            <option value="Monthly" th:selected="${watchlistEntry.expected == 'Monthly' ? 'true' : 'false'}">Monthly</option>
                        </select> 
                        <span id="expectedMsg" class="control-label"></span>
                    </div> 
                    <div id="expectFirstFileMTDiv" class="form-group" th:classappend="${#fields.hasErrors('expectFirstFile') ? 'has-error' : ''}">
                        <label class="control-label" for="expectFirstFile">Date to start the alert *</label>
                        <input th:field="*{expectFirstFile}" id="expectFirstFileMT" class="form-control expectFirstFile half" type="text" maxLength="10" />
                        <span class="control-label" th:if="${#fields.hasErrors('entryMessage')}" th:errors="*{entryMessage}"></span>
                        <span id="expectFirstFileMsg" class="control-label"></span>
                    </div>
                    <div id="expectFirstFileTimeDiv">
                        <label class="control-label" for="expectedTimeHour">Time to start the alert</label>
                        <div class="row">
                            <div class="col-md-4">
                                <select id="expectedTimeHourMT" class="form-control">
                                    <option th:each="hour : ${#numbers.sequence(1, 12, 1)}" th:selected="${watchlistEntry.expectedTimeHour == hour ? 'true' : 'false'}" th:value="${hour}" th:text="${hour}"></option>
                                </select> 
                            </div>
                            <div class="col-md-4">
                                <select id="expectedTimeMinuteMT" class="form-control">
                                     <option th:each="minute : ${#numbers.sequence(0, 55, 5)}" th:selected="${watchlistEntry.expectedTimeMinute == minute ? 'true' : 'false'}" th:value="${minute}" th:text="${minute < 10 ? '0'+minute : minute}"></option>
                                </select> 
                            </div>
                            <div class="col-md-4">
                                <select id="expectedTimeAMPMMT" class="form-control">
                                    <option value="AM" th:selected="${watchlistEntry.expectedTimeAMPM == 'AM' ? 'true' : 'false'}">AM</option>
                                    <option value="PM" th:selected="${watchlistEntry.expectedTimeAMPM == 'PM' ? 'true' : 'false'}">PM</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div> 
    </div> 
</div>
<div class="modal-footer" style="background-color: #cccccc">
    <div class="form-group">
        <input type="button" id="submitButton" th:rel="${btnValue}" class="btn btn-primary" th:value="${watchlistEntry.id > 0 ? 'Update Watch List Entry' : 'Create Watch List Entry'}"/>
    </div>
</div>
