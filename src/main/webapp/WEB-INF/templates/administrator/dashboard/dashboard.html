<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"  xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/loggedInLayout}">
     <head>
        <title>Health-e-Link UT Dashboard</title>
    </head>
    <body>
        <div class="main clearfix full-width" role="main" layout:fragment="content">
            <div class="row-fluid contain basic-clearfix">
                <div class="col-md-12 col-sm-12 col-xs-12">
                    <div>
                        <div class="pull-left">
                            <div class="form-group"></div>
                            <div class="form-container scrollable">
                                 <a href="/watchlist" title='Manage "Watch List"' class="btn btn-primary btn-small" role="button">Manage "Watch List"</a>
                            </div>
                        </div>
                        <div class="pull-right">
                             <form class="form form-inline" id="searchForm" th:action="@{/administrator}" method="post">
                                <div class="form-group">
                                    <input type="hidden" name="fromDate" id="fromDate" th:rel="${#dates.format(fromDate, 'MM/dd/yyyy')}" th:rel2="${#dates.format(originalDate, 'MM/dd/yyyy')}" th:value="${fromDate}" />
                                    <input type="hidden" name="toDate" id="toDate" th:rel="${#dates.format(toDate, 'MM/dd/yyyy')}" th:value="${toDate}" />
                                </div>
                            </form>
                            <div class="form-container scrollable">
                                <div class="date-range-picker-trigger form-control pull-right daterange" style="width:285px; margin-left: 10px;">
                                    <i class="glyphicon glyphicon-calendar"></i>
                                    <span class="date-label" th:text="${#dates.format(fromDate, 'MMMM dd, yyyy')} + ' - ' + ${#dates.format(toDate, 'MMMM dd, yyyy')}"></span> <b class="caret"></b>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            <div class="row"><p></p></div>
            <div class="row-fluid contain basic-clearfix">
                <div class="col-md-12">
                   <section class="panel panel-default container-fluid">
                        <div class="panel-heading">
                            <h3 class="panel-title">Generic Watch List Entries</h3>
                        </div>
                       <div class="panel-body">
                           <div class="form-container scrollable genericMessages"></div>
                       </div>
                   </section>
                </div>
            </div>
            <div class="row"><p></p></div>
            <div class="row-fluid contain basic-clearfix">
                <div class="col-md-12">
                    <section class="panel panel-default container-fluid">
                        <div class="panel-heading">
                            <h3 class="panel-title">Message Type Watch List Entries</h3>
                        </div>
                        <div class="panel-body">
                            <div class="row-fluid contain basic-clearfix">
                                <div class="col-md-12">
                                   <section class="panel panel-info container-fluid">
                                        <div class="panel-heading">
                                            <h3 class="panel-title">Inbound Messages</h3>
                                        </div>
                                       <div class="panel-body">
                                           <div class="form-container scrollable">
                                               <table class="table table-bordered table-default" id="inbounddataTable">
                                                    <thead class="thead-light">
                                                        <tr>
                                                            <th scope="col" class="center-text">Type</th>
                                                            <th scope="col" class="center-text">Date/Time</th>
                                                            <th scope="col" class="center-text">Trans. ID</th>
                                                            <th scope="col" class="center-text">Source</th>
                                                            <th scope="col" class="center-text">Configuration</th>
                                                            <th scope="col" class="center-text">Interface</th>
                                                            <th scope="col" class="center-text">Transactions (Rows)</th>
                                                            <th scope="col" class="center-text">Errors</th>
                                                        </tr>
                                                    </thead>
                                               </table>
                                           </div>
                                       </div>
                                   </section>
                                </div>
                            </div>
                            <div class="row"><p></p></div>
                            <div class="row-fluid contain basic-clearfix">
                                <div class="col-md-12">
                                   <section class="panel panel-warning">
                                        <div class="panel-heading">
                                            <h3 class="panel-title">Outbound Messages</h3>
                                        </div>
                                        <div class="panel-body">
                                            <div class="form-container scrollable">
                                                <table class="table table-bordered table-default" id="outbounddataTable">
                                                    <thead class="thead-light">
                                                        <tr>
                                                            <th scope="col" class="center-text">Type</th>
                                                            <th scope="col" class="center-text">Date/Time</th>
                                                            <th scope="col" class="center-text">Trans. ID</th>
                                                            <th scope="col" class="center-text">Target</th>
                                                            <th scope="col" class="center-text">Configuration</th>
                                                            <th scope="col" class="center-text">Interface</th>
                                                            <th scope="col" class="center-text">Transactions (Rows)</th>
                                                            <th scope="col" class="center-text">Errors</th>
                                                        </tr>
                                                    </thead>
                                                 </table>
                                            </div>
                                        </div>
                                   </section>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
        <th:block layout:fragment="script">
            <script th:src="@{/dspResources/js/vendor/dataTables/jquery.dataTables.min.js}"></script>
            <script th:src="@{/dspResources/js/vendor/dataTables/jquery.dataTables.bootstrap.min.js}"></script>
            <script th:src="@{/dspResources/js/admin/dashboard/dashboard.js}"></script>
            <script th:src="@{/dspResources/js/admin/dashboard/genericDashboard.js}"></script>
        </th:block>
    </body>
</html>
