<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"  xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/loggedInLayout}">
     <head>
        <title>Health-e-Link UT Organizations</title>
    </head>
    <body>
        <div layout:fragment="content">
            <div th:insert="~{administrator/organizations/actionBar :: actionBar}"></div>
            <div class="main clearfix full-width" role="main" >
                <div class="col-md-12">
                    <div class="alert alert-success" role="alert" th:if="${savedStatus != null}">
                        <strong>Success!</strong> 
                        <p th:if="${savedStatus == 'updated'}">The organization has been successfully updated!</p>
                        <p th:if="${savedStatus == 'created'}">The organization has been successfully added!</p>
                        <p th:if="${savedStatus == 'deleted'}">The organization has been successfully removed!</p>
                    </div>
                    <section class="panel panel-default">
                        <div class="panel-body">
                            <div class="row-fluid contain basic-clearfix">
                                <div class="col-md-12">
                                   <section class="panel panel-info container-fluid">
                                        <div class="panel-heading">
                                            <h3 class="panel-title">Organizations</h3>
                                        </div>
                                       <div class="panel-body">
                                           <div class="form-container">
                                                <table  class="table table-striped table-hover table-default" id="organization-table" style="cursor:pointer;" >
                                                    <thead>
                                                         <tr>
                                                            <th scope="col" class="center-text">Id</th>
                                                            <th scope="col">Organization Name</th>
                                                            <th scope="col">Health-e-Link System</th>
                                                            <th scope="col">Contact Information</th>
                                                            <th scope="col" class="center-text">Date Created</th>
                                                            <th scope="col"></th>
                                                        </tr>
                                                    </thead>
                                                </table>
                                           </div>
                                       </div>
                                   </section>
                                </div>
                            </div>
                        </div> 
                    </section>
                </div>
            </div>
        </div>
        <th:block layout:fragment="script">
            <script th:src="@{/dspResources/js/vendor/dataTables/jquery.dataTables.min.js}"></script>
            <script th:src="@{/dspResources/js/vendor/dataTables/jquery.dataTables.bootstrap.min.js}"></script>
            <script th:src="@{/dspResources/js/admin/organization/list.js}"></script>
        </th:block>
    </body>
</html>
