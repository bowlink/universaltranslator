<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"  xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/publicLayout}">
    <head>
    <title>Health-e-Link UT Forgot Password</title>
    </head>
    <body>
        <div class="login-container" style="width:500px; margin-left: -250px;" layout:fragment="content">
            <div class="login clearfix">
                 <header class="login-header" role="banner">
                    <div class="login-header-content">
                        <p style="color:white; font-family: sans-serif; font-size: 25px">EAH Universal Translator</p>
                    </div>
                </header>
                <div id="noResults" class="alert alert-danger center-text" role="alert" style="display:none">
                    <strong>No Search Results</strong><br />
                    Your search did not return any results. Please try again with other information.
                </div>            
                <div id="emailSent" class="alert alert-success center-text" role="alert" style="display:none">
                    <strong>Email Sent</strong><br />
                    An email has been sent that will contain a link to reset your password.
                </div>
                <form id="retrievePasswordForm">
                    <div class="form-container">
                        <div id="brochureTitleDiv" class="form-group"  th:classappend="${error} ? 'has-error' : ''">
                            <label class="control-label" for="identifier">Email, Username or Full Name</label>
                            <input id="identifier" name="identifier" class="form-control" value="" type="text" maxLength="255" required="true" />
                        </div>
                        <div class="form-group">
                            <input type="submit" id="submitButton" class="btn btn-primary pull-right" value="Search"/>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <th:block layout:fragment="script">
            <script th:src="@{/dspResources/js/admin/forgotPassword.js}"></script>
        </th:block>
    </body>
</html>
