<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"  xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/publicLayout}">
  <head>
    <title>Health-e-Link UT Login</title>
  </head>
  <body>
    <!-- /* Content of this page will be decorated by the elements of layout.html (task/layout) */ -->
    <div class="login-container" style="width:500px; margin-left: -250px;" layout:fragment="content">
        <div class="login clearfix">
            <header class="login-header" role="banner">
                <div class="login-header-content">
                    <p style="color:white; font-family: sans-serif; font-size: 25px">EAH Universal Translator</p>
                </div>
            </header>
            <div class="alert alert-danger center-text" role="alert" th:if="${error}">
                Your login attempt was unsuccessful.
            </div>
            <div th:if="${msg != null and msg == 'notfound'}" class="alert alert-danger center-text" role="alert">
                <p>You password was not updated. The reset code has expired, please try again.</p>
            </div>
            <div th:if="${msg != null and msg == 'updated'}" class="alert alert-success center-text" role="alert">
                <p>Your password has been successfully updated.</p>
            </div>
            <form id="form-admin-login" th:action="@{'loginAction'}" method="post" autocomplete="no-fill">
                <fieldset name="login-fields" form="form-admin-login" class="basic-clearfix">
                    <div class="form-group" th:classappend="${error} ? 'has-error' : ''">
                        <label class="control-label" for="username">Username</label>
                        <input id="username" name='username' class="form-control" type="text" value="" autofocus="true" placeholder="Username" required />
                    </div>
                    <div class="form-group" th:classappend="${error} ? 'has-error' : ''">
                        <label class="control-label" for="password">Password</label>
                        <input id="password" name='password' class="form-control" type="password" value="" placeholder="Password" required />
                    </div>
                    <input type="submit" value="Login" class="btn btn-primary pull-right" role="button"/>
                </fieldset>
            </form>
        </div>
         <p class="login-note"><a href="/forgotPassword" id="forgotPassword" title="Forget Your Password?">Forgot Password?</a></p>
    </div>
    <th:block layout:fragment="script">
        <script th:src="@{/dspResources/js/admin/login.js}"></script>
    </th:block>
  </body>
</html>
