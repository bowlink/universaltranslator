<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"  xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/publicLayout}">
  <head>
    <title>Health-e-Link UT Authenticate Login</title>
  </head>
  <body>
    <!-- /* Content of this page will be decorated by the elements of layout.html (task/layout) */ -->
    <div class="login-container" style="width:500px; margin-left: -250px;" layout:fragment="content">
        <div class="login clearfix">
            <header class="login-header" role="banner">
                <div class="login-header-content">
                    <p style="color:white; font-family: sans-serif; font-size: 25px">Two-Factor Authentication</p>
                </div>
            </header>
            <div class="alert alert-danger center-text newCodeMsg" role="alert" style="display:none;"></div>
            <fieldset name="login-fields" form="form-admin-login" class="basic-clearfix">
                <p>We sent a verification code to the email address attached to your account.</p>
                <div class="form-group ${not empty error ? 'has-error' : '' }">
                    <label class="control-label" for="username">Verification Code</label>
                    <input type="text" class="form-control verificationCode" placeholder="Verification Code" name="verificationCode" maxlength="20" value="" autofocus="true" autocomplete="off" />
                </div>
                <input type="button" value="Verify and sign in" class="btn btn-lg btn-primary btn-block verifyCode" role="button"/>
            </fieldset>
        </div>
        <p class="login-note"><a href="#!" class="resendCode" title="Send New Authentication Code">Send New Authentication Code</a></p>
    </div>
    <th:block layout:fragment="script">
        <script th:src="@{/dspResources/js/admin/authenticate.js}"></script>
    </th:block>
  </body>
</html>
